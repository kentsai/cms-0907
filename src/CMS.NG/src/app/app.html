<!--
  One router-outlet for both modes. On a chromeless route (data.chromeless, e.g. the course print view) the
  wrapper loses the shell grid, the topbar / sidebar / toast / confirm dialog are not rendered and <main> has no
  padding or scrolling pane, so the routed page is the whole document. The outlet itself must not sit inside an
  @if: re-creating it re-activates the route and instantiates the routed component a second time.
-->
<div
  [class.app-shell]="!chromeless()"
  [class.app-shell--collapsed]="!chromeless() && sidebarCollapsed()"
  [class.app-shell--anonymous]="!chromeless() && !auth.isAuthenticated()"
  [class.app-shell--locked]="!chromeless() && auth.mustChangePassword()">
  @if (!chromeless() && auth.isAuthenticated()) {
    <header class="app-topbar">
      @if (!auth.mustChangePassword()) {
        <button
          type="button"
          class="app-topbar__toggle"
          pButton
          text
          rounded
          icon="pi pi-bars"
          [attr.aria-label]="sidebarCollapsed() ? '展開選單' : '收合選單'"
          (click)="toggleSidebar()"></button>
      }
      <span class="app-topbar__title">{{ title() }}</span>

      <span class="app-topbar__spacer"></span>

      @if (auth.mustChangePassword()) {
        <!-- Locked until the default password is changed: no menu, no profile link — just the name and 登出. -->
        <span class="app-topbar__user app-topbar__user--locked" title="請先變更密碼">
          <i class="pi pi-user"></i>
          <span class="app-topbar__user-name">{{ auth.userName() }}</span>
          <span class="app-topbar__user-hint">請先變更密碼</span>
        </span>
      } @else {
        <!-- User menu: the name links to 個人資料 My Profile; 登出 sits next to it. -->
        <a
          class="app-topbar__user"
          routerLink="/profile"
          routerLinkActive="app-topbar__user--active"
          title="個人資料 My Profile">
          <i class="pi pi-user"></i>
          <span class="app-topbar__user-name">{{ auth.userName() }}</span>
          <span class="app-topbar__user-hint">個人資料</span>
        </a>
      }
      <button
        type="button"
        class="app-topbar__logout"
        pButton
        text
        icon="pi pi-sign-out"
        label="登出"
        (click)="logout()"></button>
    </header>

    @if (!auth.mustChangePassword()) {
      <aside class="app-sidebar">
        <p-panelmenu [model]="menuItems()" styleClass="app-sidebar__menu" />
      </aside>
    }
  }

  <main [class.app-content]="!chromeless()">
    <router-outlet />
  </main>
</div>

@if (!chromeless()) {
  <!-- Shared once at shell level; feature pages only inject MessageService / ConfirmationService. -->
  <p-toast position="top-right" />
  <p-confirmdialog />
}
