<p-toolbar styleClass="page-toolbar">
  <ng-template #start>
    <div class="toolbar-title">
      <h1>發布狀態</h1>
      @if (item(); as it) {
        <span class="toolbar-title__sub">{{ it.pkid }}　{{ it.description }}</span>
        <app-row-audit-badge tableName="PublishStatus" [pk]="it.pkid" />
      }
    </div>
  </ng-template>
  <ng-template #end>
    <div class="toolbar-actions">
      <p-button label="返回" icon="pi pi-arrow-left" severity="secondary" [outlined]="true" (onClick)="back()" />
      <p-button label="編輯" icon="pi pi-pencil" [disabled]="!item()" (onClick)="edit()" />
      <p-button label="刪除" icon="pi pi-trash" severity="danger" [outlined]="true" [disabled]="!item()" (onClick)="confirmDelete()" />
    </div>
  </ng-template>
</p-toolbar>

@if (loading()) {
  <p class="state">載入中…</p>
} @else if (notFound()) {
  <p-card>
    <p class="state">找不到主代碼 {{ pkid }} 的發布狀態。</p>
  </p-card>
} @else if (item(); as it) {
  <p-card header="狀態資料" styleClass="detail-card">
    <dl class="detail-grid">
      <dt>主代碼</dt>
      <dd>{{ it.pkid }}</dd>

      <dt>狀態說明</dt>
      <dd>{{ it.description }}</dd>

      <dt>草稿</dt>
      <dd><p-tag [severity]="it.isDraft ? 'success' : 'secondary'" [value]="it.isDraft ? '是' : '否'" /></dd>

      <dt>已發布</dt>
      <dd><p-tag [severity]="it.isPublished ? 'success' : 'secondary'" [value]="it.isPublished ? '是' : '否'" /></dd>

      <dt>已下架</dt>
      <dd><p-tag [severity]="it.isDiscontinued ? 'success' : 'secondary'" [value]="it.isDiscontinued ? '是' : '否'" /></dd>
    </dl>
  </p-card>

  <p-card header="相關資料" styleClass="detail-card">
    <div class="related-links">
      <p-button
        label="查看課程"
        icon="pi pi-book"
        severity="secondary"
        [outlined]="true"
        routerLink="/course/courses"
        [queryParams]="{ publishStatusPkid: it.pkid }" />
      <p-button
        label="查看活動"
        icon="pi pi-megaphone"
        severity="secondary"
        [outlined]="true"
        routerLink="/promotion/promotions"
        [queryParams]="{ publishStatusPkid: it.pkid }" />
    </div>
  </p-card>
}
