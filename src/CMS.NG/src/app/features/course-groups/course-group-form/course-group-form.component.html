<form [formGroup]="form" (ngSubmit)="save()" novalidate>
  <p-toolbar styleClass="page-toolbar">
    <ng-template #start>
      <div class="toolbar-title">
        <h1>{{ title }}</h1>
        @if (isEdit && pkid !== null) {
          <span class="toolbar-title__sub">主代碼 {{ pkid }}</span>
          <app-row-audit-badge tableName="CourseGroup" [pkid]="pkid" />
        }
      </div>
    </ng-template>
    <ng-template #end>
      <div class="toolbar-actions">
        <p-button label="取消" icon="pi pi-times" severity="secondary" type="button" (onClick)="cancel()" />
        <p-button label="儲存" icon="pi pi-check" severity="success" type="submit" [loading]="saving()" [disabled]="form.invalid || saving() || loading()" />
      </div>
    </ng-template>
  </p-toolbar>

  <p-card header="群組資料" styleClass="form-card">
    <div class="form-grid">
      <div class="field">
        <label for="description">說明 <span class="required">*</span></label>
        <input id="description" pInputText formControlName="description" maxlength="100" placeholder="請輸入課程群組說明" autocomplete="off" />
        @if (isInvalid('description')) {
          <small class="error">請輸入說明（最多 100 字）</small>
        }
      </div>
    </div>
  </p-card>
</form>
