<p-toolbar styleClass="page-toolbar">
  <ng-template #start>
    <div class="toolbar-title">
      <h1>課程群組</h1>
      @if (item(); as it) {
        <span class="toolbar-title__sub">{{ it.pkid }}　{{ it.description }}</span>
        <app-row-audit-badge tableName="CourseGroup" [pkid]="it.pkid" />
      }
    </div>
  </ng-template>
  <ng-template #end>
    <div class="toolbar-actions">
      <p-button label="返回" icon="pi pi-arrow-left" severity="secondary" [outlined]="true" (onClick)="back()" />
      <p-button label="編輯" icon="pi pi-pencil" [disabled]="!item()" (onClick)="edit()" />
      <p-button label="刪除" icon="pi pi-trash" severity="danger" [outlined]="true" [disabled]="!item()" (onClick)="confirmDelete()" />
    </div>
  </ng-template>
</p-toolbar>

@if (loading()) {
  <p class="state">載入中…</p>
} @else if (notFound()) {
  <p-card>
    <p class="state">找不到主代碼 {{ pkid }} 的課程群組。</p>
  </p-card>
} @else if (item(); as it) {
  <p-card header="群組資料" styleClass="detail-card">
    <dl class="detail-grid">
      <dt>主代碼</dt>
      <dd>{{ it.pkid }}</dd>

      <dt>說明</dt>
      <dd>{{ it.description }}</dd>
    </dl>
  </p-card>

  <p-card header="相關資料" styleClass="detail-card">
    <div class="related-links">
      <p-button
        label="查看課程"
        icon="pi pi-book"
        severity="secondary"
        [outlined]="true"
        routerLink="/course/courses"
        [queryParams]="{ courseGroupPkid: it.pkid }" />
      <p-button
        label="查看夥伴課程群組"
        icon="pi pi-sitemap"
        severity="secondary"
        [outlined]="true"
        routerLink="/course/partner-course-groups"
        [queryParams]="{ courseGroupPkid: it.pkid }" />
    </div>
  </p-card>
}
