<div class="login-page">
  <p-card styleClass="login-card">
    <ng-template #header>
      <div class="login-card__header">
        <i class="pi pi-lock"></i>
        <h1>CMS 登入</h1>
      </div>
    </ng-template>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      @if (notice; as message) {
        <p-message severity="info" styleClass="login-notice" data-testid="login-notice">{{ message }}</p-message>
      }

      <div class="field">
        <label for="userId">帳號</label>
        <input id="userId" pInputText formControlName="userId" maxlength="200" autocomplete="username" autofocus />
        @if (isInvalid('userId')) {
          <small class="error">請輸入帳號</small>
        }
      </div>

      <div class="field">
        <label for="password">密碼</label>
        <input id="password" pInputText type="password" formControlName="password" autocomplete="current-password" />
        @if (isInvalid('password')) {
          <small class="error">請輸入密碼</small>
        }
      </div>

      @if (errorMessage(); as message) {
        <p-message severity="error" styleClass="login-error">{{ message }}</p-message>
      }

      <p-button
        label="登入"
        icon="pi pi-sign-in"
        type="submit"
        styleClass="login-submit"
        [loading]="loading()"
        [disabled]="loading()" />
    </form>
  </p-card>
</div>
