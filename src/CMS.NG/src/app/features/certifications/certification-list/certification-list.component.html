<div class="page">
  <header class="page-header">
    <div class="page-header__title">
      <h1>認證 Certification</h1>
      <span class="page-header__subtitle">原廠認證主檔</span>
    </div>
    <div class="page-header__actions">
      <p-button
        label="搜尋條件"
        icon="pi pi-filter"
        severity="secondary"
        [badge]="filterBadge"
        badgeSeverity="info"
        class="filter-button"
        (onClick)="openFilters()" />
      <p-button label="新增" icon="pi pi-plus" severity="success" routerLink="/course/certifications/new" />
    </div>
  </header>

  <section class="page-body">
    <p-table
      [value]="items()"
      [loading]="loading()"
      dataKey="pkid"
      [paginator]="true"
      paginatorPosition="top"
      [rows]="rows"
      [first]="first"
      [rowsPerPageOptions]="rowsPerPageOptions"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
      [sortField]="sortField"
      [sortOrder]="sortOrder"
      (onSort)="onSort($event)"
      (onPage)="onPage($event)"
      [rowHover]="true"
      styleClass="p-datatable-sm certification-table">
      <ng-template #header>
        <tr>
          <th pSortableColumn="pkid" class="col-pkid">主代碼 <p-sortIcon field="pkid" /></th>
          <th pSortableColumn="partnerName" class="col-partner">原廠 <p-sortIcon field="partnerName" /></th>
          <th pSortableColumn="title" class="col-title">認證名稱 <p-sortIcon field="title" /></th>
          <th class="col-actions">操作</th>
        </tr>
      </ng-template>
      <ng-template #body let-item>
        <tr>
          <td class="col-pkid">{{ item.pkid }}</td>
          <td class="col-partner">{{ item.partnerName }}</td>
          <td class="col-title" [class.muted]="!item.title">{{ item.title || '—' }}</td>
          <td class="col-actions">
            <p-button icon="pi pi-eye" [text]="true" [rounded]="true" size="small" pTooltip="檢視" tooltipPosition="top" (onClick)="view(item)" />
            <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" size="small" pTooltip="編輯" tooltipPosition="top" (onClick)="edit(item)" />
            <p-button icon="pi pi-trash" [text]="true" [rounded]="true" size="small" severity="danger" pTooltip="刪除" tooltipPosition="top" (onClick)="confirmDelete(item)" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="4" class="empty">沒有符合條件的資料。</td>
        </tr>
      </ng-template>
    </p-table>
  </section>
</div>

<p-drawer [visible]="filterVisible()" (visibleChange)="filterVisible.set($event)" position="right" header="搜尋條件" styleClass="filter-drawer">
  <form class="filter-form" (ngSubmit)="search()">
    <div class="field">
      <label for="f-keyword">關鍵字</label>
      <input id="f-keyword" pInputText name="keyword" [(ngModel)]="filters.keyword" placeholder="認證名稱" autocomplete="off" />
    </div>

    <div class="field">
      <label for="f-partner">原廠</label>
      <p-select
        inputId="f-partner"
        name="partnerPkid"
        [(ngModel)]="filters.partnerPkid"
        [options]="partners()"
        optionLabel="label"
        optionValue="pkid"
        [filter]="true"
        filterBy="label"
        [showClear]="true"
        placeholder="全部"
        appendTo="body"
        styleClass="w-full" />
    </div>

    <div class="field">
      <label for="f-course">對應課程</label>
      <p-select
        inputId="f-course"
        name="coursePkid"
        [(ngModel)]="filters.coursePkid"
        [options]="courses()"
        optionLabel="label"
        optionValue="pkid"
        [filter]="true"
        filterBy="label"
        [virtualScroll]="true"
        [virtualScrollItemSize]="43"
        [showClear]="true"
        placeholder="全部"
        appendTo="body"
        styleClass="w-full" />
    </div>

    <div class="field">
      <label for="f-jobCategory">職務類別</label>
      <p-select
        inputId="f-jobCategory"
        name="jobCategoryPkid"
        [(ngModel)]="filters.jobCategoryPkid"
        [options]="jobCategories()"
        optionLabel="label"
        optionValue="pkid"
        [filter]="true"
        filterBy="label"
        [showClear]="true"
        placeholder="全部"
        appendTo="body"
        styleClass="w-full" />
    </div>

    <div class="filter-form__actions">
      <p-button label="清除" icon="pi pi-times" severity="secondary" [outlined]="true" type="button" (onClick)="clearFilters()" />
      <p-button label="查詢" icon="pi pi-search" type="submit" />
    </div>
  </form>
</p-drawer>
